# Board defconfig already sets: GPIO, CONFIG_CONSOLE, CONFIG_RAM_CONSOLE,
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=1024, CONFIG_UART_CONSOLE=n, SERIAL, etc.
# SOC selects CONFIG_OPENAMP_RSC_TABLE when RAM_CONSOLE (see stm32mp1x Kconfig).

CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
# For Lesson 6 and 7: Task 1: Use the sensor driver API (set to y to enable sensor API)
# For Lesson 6 and 7: Task 2: Use the custom extension API (set to n to enable custom extension API)
CONFIG_SENSOR=n
CONFIG_DOORSTEP_SOMEDRIVER=y
CONFIG_APP_LED_SUBSYSTEM=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMDS=y
